---
kind: pipeline
type: docker
name: validate-amd64
platform:
  os: linux
  arch: amd64
steps:
  - name: verify
    image: node:26-trixie-slim
    environment:
      STAKEOUT_SERVER_DATABASE_URL: postgresql://stakeout:password@postgresql:5432/postgres
      STAKEOUT_TEST_DATABASE_URL: postgresql://stakeout:password@postgresql:5432/postgres
    commands:
      - apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates
      - npm ci --ignore-scripts
      - npm run build
      - npm test
services:
  - name: postgresql
    image: postgres:18
    environment:
      POSTGRES_USER: stakeout
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
---
kind: pipeline
type: docker
name: validate-arm64
platform:
  os: linux
  arch: arm64
steps:
  - name: verify
    image: node:26-trixie-slim
    environment:
      STAKEOUT_SERVER_DATABASE_URL: postgresql://stakeout:password@postgresql:5432/postgres
      STAKEOUT_TEST_DATABASE_URL: postgresql://stakeout:password@postgresql:5432/postgres
    commands:
      - apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates
      - npm ci --ignore-scripts
      - npm run build
      - npm test
services:
  - name: postgresql
    image: postgres:18
    environment:
      POSTGRES_USER: stakeout
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
---
kind: pipeline
type: docker
name: ui-amd64
depends_on:
  - validate-amd64
platform:
  os: linux
  arch: amd64
steps:
  - name: publish
    image: plugins/docker
    settings:
      context: .
      dockerfile: ui/Dockerfile
      repo: p3000/stakeout-ui
      tags:
        - ${DRONE_COMMIT_SHA}-linux-amd64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
trigger:
  event:
    - push
---
kind: pipeline
type: docker
name: ui-arm64
depends_on:
  - validate-arm64
platform:
  os: linux
  arch: arm64
steps:
  - name: publish
    image: plugins/docker
    settings:
      context: .
      dockerfile: ui/Dockerfile
      repo: p3000/stakeout-ui
      tags:
        - ${DRONE_COMMIT_SHA}-linux-arm64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
trigger:
  event:
    - push
---
kind: pipeline
type: docker
name: ui-manifest
depends_on:
  - ui-amd64
  - ui-arm64
steps:
  - name: publish
    image: plugins/manifest
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      target: p3000/stakeout-ui:latest
      template: p3000/stakeout-ui:${DRONE_COMMIT_SHA}-OS-ARCH
      platforms:
        - linux/amd64
        - linux/arm64
trigger:
  branch:
    - master
  event:
    - push
  status:
    - success
---
